version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      # aws-sdk-go-v2 ships ~10 interdependent submodules that version in
      # lockstep -- group them so Dependabot opens one PR, not ten.
      aws-sdk-go-v2:
        patterns:
          - "github.com/aws/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
