name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Catches newly-disclosed query/vulnerability patterns even on weeks
    # with no code changes.
    - cron: '0 3 * * 1' # Monday 03:00 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (Go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
