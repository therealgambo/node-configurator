name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      # Job-level permissions replace (not add to) the workflow-level
      # block above, so contents:read has to be repeated here for
      # checkout to work.
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # -race is cheap here (small, mostly single-threaded packages) and
      # catches data races in the concurrent bits for free.
      - name: Run tests
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out

      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out > coverage-summary.txt
          {
            echo "### Test coverage"
            echo '```'
            tail -n 1 coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate HTML coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      # Self-contained: no external coverage service/token required. Add a
      # Codecov (or similar) upload step later if you want PR diff-coverage
      # comments -- it needs a CODECOV_TOKEN repo secret for private repos.
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html
            coverage-summary.txt
          retention-days: 30

      # Edits the same comment on repeat pushes to a PR (matched via the
      # hidden marker) instead of posting a new one every time.
      # continue-on-error since a PR from a fork gets a read-only token by
      # default -- a coverage comment failing to post shouldn't fail CI.
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker="<!-- node-configurator-coverage-report -->"
          # Built with individual `echo`s rather than a heredoc/multi-line
          # string: this step's own source indentation (required by YAML)
          # would otherwise end up embedded as leading whitespace in every
          # line, turning the ``` fences into indented (not fenced)
          # markdown blocks.
          {
            echo "$marker"
            echo "## Test coverage"
            echo
            echo '```'
            tail -n 1 coverage-summary.txt
            echo '```'
            echo
            echo "<details>"
            echo "<summary>Per-function breakdown</summary>"
            echo
            echo '```'
            cat coverage-summary.txt
            echo '```'
            echo "</details>"
          } > /tmp/coverage-comment.md

          existing_id=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)

          if [ -n "$existing_id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing_id" -F body=@/tmp/coverage-comment.md
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/coverage-comment.md
          fi

  build:
    name: Cross-compile (linux/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # This tool only ever runs on Linux (EC2 instances); the matrix
      # mirrors the two architectures the Makefile's `build` target ships
      # (x86_64 and Graviton/arm64).
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -o /dev/null ./...

  smoke-test:
    name: Smoke test (apply on live runner)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build native binary
        run: go build -o node-configurator ./cmd/node-configurator

      - name: Install ethtool
        run: sudo apt-get update && sudo apt-get install -y ethtool

      # The GitHub-hosted runner is a real, ephemeral Linux VM: real
      # /proc, /sys, systemd, swap, an actual NIC. This exercises genuine
      # Check/Apply code paths (sysctl writes, swapoff, bpffs mount,
      # RPS/XPS, ulimit drop-ins) that unit tests can only verify against a
      # faked filesystem. It won't have ENA/NVMe hardware or real IMDS, so
      # NIC-ring/IRQ/hugepages tuning and instance-aware sizing still won't
      # be exercised for real -- see README for that gap. Running `apply`
      # for real is safe here specifically because this VM is destroyed at
      # the end of the job, unlike a developer's own machine.
      - name: check (drift is expected on a fresh runner)
        run: |
          set +e
          sudo ./node-configurator check
          code=$?
          set -e
          echo "check exit code: $code"
          # 0 = nothing to do, 2 = drift pending (expected here). 1 means a
          # resource's Check itself failed -- a real problem.
          if [ "$code" -eq 1 ]; then
            echo "::error::node-configurator check reported a resource failure"
            exit 1
          fi

      - name: apply (real convergence against this runner's live state)
        run: sudo ./node-configurator apply

      - name: re-check (must be a no-op -- idempotency)
        run: |
          set +e
          sudo ./node-configurator check
          code=$?
          set -e
          echo "post-apply check exit code: $code"
          if [ "$code" -ne 0 ]; then
            echo "::error::drift (or a failure) remained after apply already converged -- possible idempotency bug"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check gofmt formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
